      - ./crypto-config/peerOrganizations/wholesaler.pharmchain.com/peers/peer0.wholesaler.pharmchain.com/tls:/etc/hyperledger/fabric/tls
      - ./crypto-config/peerOrganizations/wholesaler.pharmchain.com/users/Admin@wholesaler.pharmchain.com/msp:/etc/hyperledger/fabric/users/admin/msp
    ports:
