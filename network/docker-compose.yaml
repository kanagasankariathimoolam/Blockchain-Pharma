      - ./crypto-config/peerOrganizations/distributor2.pharmchain.com/peers/peer0.distributor2.pharmchain.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/distributor2.pharmchain.com/peers/peer0.distributor2.pharmchain.com/tls:/etc/hyperledger/fabric/tls
      - ./crypto-config/peerOrganizations/distributor2.pharmchain.com/users/Admin@distributor2.pharmchain.com/msp:/etc/hyperledger/fabric/users/admin/msp
    ports:
