      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.distributor2.pharmchain.com
      - CORE_PEER_ADDRESS=peer0.distributor2.pharmchain.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.distributor2.pharmchain.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.distributor2.pharmchain.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.distributor2.pharmchain.com:9051
      - CORE_PEER_LOCALMSPID=NationalDistributor2MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
