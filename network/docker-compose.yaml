      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.distributor1.pharmchain.com
      - CORE_PEER_ADDRESS=peer0.distributor1.pharmchain.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.distributor1.pharmchain.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.distributor1.pharmchain.com:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.distributor1.pharmchain.com:8051
      - CORE_PEER_LOCALMSPID=NationalDistributor1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/distributor1.pharmchain.com/peers/peer0.distributor1.pharmchain.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/distributor1.pharmchain.com/peers/peer0.distributor1.pharmchain.com/tls:/etc/hyperledger/fabric/tls
      - ./crypto-config/peerOrganizations/distributor1.pharmchain.com/users/Admin@distributor1.pharmchain.com/msp:/etc/hyperledger/fabric/users/admin/msp
    ports:
      - 8051:8051
    networks:
      - pharmchain
    depends_on:
      - orderer.tier1.pharmchain.com

