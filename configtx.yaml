# PharmChain — Hyperledger Fabric v2.4 Network Configuration
# configtx.yaml — Channel and Policy Configuration
# Experimental configuration as described in manuscript Section 5.2
# 6 organizations: 4 Tier2 validators, 1 Tier3 endorser, 1 Tier1 root authority

---
Organizations:

  - &Tier1RootAuthority
    Name: Tier1RootAuthorityMSP
    ID: Tier1RootAuthorityMSP
    MSPDir: crypto-config/peerOrganizations/tier1.pharmchain.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Tier1RootAuthorityMSP.admin', 'Tier1RootAuthorityMSP.peer', 'Tier1RootAuthorityMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('Tier1RootAuthorityMSP.admin', 'Tier1RootAuthorityMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('Tier1RootAuthorityMSP.admin')"
    AnchorPeers:
      - Host: peer0.tier1.pharmchain.com
        Port: 7051

  - &Manufacturer
    Name: ManufacturerMSP
    ID: ManufacturerMSP
    MSPDir: crypto-config/peerOrganizations/manufacturer.pharmchain.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('ManufacturerMSP.admin', 'ManufacturerMSP.peer', 'ManufacturerMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('ManufacturerMSP.admin', 'ManufacturerMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('ManufacturerMSP.admin')"
    AnchorPeers:
      - Host: peer0.manufacturer.pharmchain.com
        Port: 7051

  - &NationalDistributor1
    Name: NationalDistributor1MSP
    ID: NationalDistributor1MSP
    MSPDir: crypto-config/peerOrganizations/distributor1.pharmchain.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('NationalDistributor1MSP.admin', 'NationalDistributor1MSP.peer', 'NationalDistributor1MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('NationalDistributor1MSP.admin', 'NationalDistributor1MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('NationalDistributor1MSP.admin')"
    AnchorPeers:
      - Host: peer0.distributor1.pharmchain.com
        Port: 7051

  - &NationalDistributor2
    Name: NationalDistributor2MSP
    ID: NationalDistributor2MSP
    MSPDir: crypto-config/peerOrganizations/distributor2.pharmchain.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('NationalDistributor2MSP.admin', 'NationalDistributor2MSP.peer', 'NationalDistributor2MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('NationalDistributor2MSP.admin', 'NationalDistributor2MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('NationalDistributor2MSP.admin')"
    AnchorPeers:
      - Host: peer0.distributor2.pharmchain.com
        Port: 7051

  - &MajorWholesaler
    Name: MajorWholesalerMSP
    ID: MajorWholesalerMSP
    MSPDir: crypto-config/peerOrganizations/wholesaler.pharmchain.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('MajorWholesalerMSP.admin', 'MajorWholesalerMSP.peer', 'MajorWholesalerMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('MajorWholesalerMSP.admin', 'MajorWholesalerMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('MajorWholesalerMSP.admin')"
    AnchorPeers:
      - Host: peer0.wholesaler.pharmchain.com
        Port: 7051

  - &Pharmacy
    Name: PharmacyMSP
    ID: PharmacyMSP
    MSPDir: crypto-config/peerOrganizations/pharmacy.pharmchain.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('PharmacyMSP.admin', 'PharmacyMSP.peer', 'PharmacyMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('PharmacyMSP.admin', 'PharmacyMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('PharmacyMSP.admin')"
    AnchorPeers:
      - Host: peer0.pharmacy.pharmchain.com
        Port: 7051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  # HPoA consensus plugin replaces default RAFT orderer
  # OrdererType: hpoa  (custom plugin — see hpoa_plugin.go)
  OrdererType: etcdraft
  Addresses:
    - orderer.pharmchain.com:7050
  BatchTimeout: 1s       # Manuscript Table 4: BatchTimeout = 1s
  BatchSize:
    MaxMessageCount: 100   # Manuscript Table 4: block_size = 100 transactions
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  PharmChainGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *Tier1RootAuthority
    Consortiums:
      PharmChainConsortium:
        Organizations:
          - *Manufacturer
          - *NationalDistributor1
          - *NationalDistributor2
          - *MajorWholesaler
          - *Pharmacy

  PharmChainChannel:
    Consortium: PharmChainConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *Manufacturer
        - *NationalDistributor1
        - *NationalDistributor2
        - *MajorWholesaler
        - *Pharmacy
      Capabilities:
        <<: *ApplicationCapabilities